<!DOCTYPE html>
<html lang="en">
<head>

<title>C Quiz</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/quiz.css">
</head>

<body>

<div class="quiz-container fade">

  <h1>Exercise</h1>
  <p id="question"></p>

  <div class="options">
    <label><input type="radio" name="opt" value="a"><span id="a"></span></label>
    <label><input type="radio" name="opt" value="b"><span id="b"></span></label>
    <label><input type="radio" name="opt" value="c"><span id="c"></span></label>
    <label><input type="radio" name="opt" value="d"><span id="d"></span></label>
  </div>

  <button onclick="submitQuiz()">Submit Answer »</button>

</div>

<script src="js/quiz.js"></script>
</body>
</html>
