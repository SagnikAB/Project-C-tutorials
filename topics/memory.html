<h2>Memory Management in C</h2>

<p>C allows manual memory allocation using malloc, calloc, realloc and free.</p>

<pre id="codeBlock">
#include <stdio.h>
#include <stdlib.h>

int main() {
    int *ptr = (int*) malloc(sizeof(int));
    *ptr = 10;
    printf("%d", *ptr);
    free(ptr);
    return 0;
}
</pre>
